# If you make any changes to this file while the container is running, you will have to
# close the container and then re-open to observe changes.

services:
  db:
    image: mysql:latest
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}

  tailscale:
    # v1.78.1 panics on Docker when TS_SERVE_CONFIG is set (nil kubeClient); fixed in v1.78.3. See tailscale/tailscale#14354.
    image: ghcr.io/tailscale/tailscale:v1.78.3
    hostname: ${TAILSCALE_MAGICDNS_HOSTNAME}
    ports:
      - "${WEB_PORT}:80"
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      # Userspace networking: no /dev/net/tun (unprivileged LXC cannot create it).
      # Kernel TUN is more reliable for Serve; only set TS_USERSPACE=false if the host provides /dev/net/tun.
      TS_USERSPACE: ${TS_USERSPACE:-true}
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:-}
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./tailscale/serve:/config
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  wordpress:
    network_mode: "service:tailscale"
    depends_on:
      - tailscale
      - db
    image: liquidloose/wordpress-image:latest
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DEBUG: "1" # A non-empty value enables WP_DEBUG in wp-config.php
      # Default https MagicDNS URL when WORDPRESS_PUBLIC_URL is unset (${VAR-} only substitutes when unset, not when empty—add WORDPRESS_PUBLIC_URL= for localhost-only).
      WORDPRESS_PUBLIC_URL: ${WORDPRESS_PUBLIC_URL-https://${TAILSCALE_MAGICDNS_HOSTNAME}.${TAILNET_DNS_SUFFIX}}
      # Set to 1 only if you want FORCE_SSL_ADMIN (can break wp-login on http://localhost when public URL is https).
      WORDPRESS_FORCE_SSL_ADMIN: ${WORDPRESS_FORCE_SSL_ADMIN:-}
    volumes:
      - type: bind
        source: "./WordPress/wp-content/"
        target: "/var/www/html/wp-content/"
      - type: bind
        source: "./wordpress.ini"
        target: "/usr/local/etc/php/conf.d/wordpress.ini"
      - type: bind
        source: "./wp-config.php"
        target: "/var/www/html/wp-config.php"

  # One-shot: after core is installed, install/activate slugs from bin/wp-plugins.txt, then exit.
  # Re-runs on later `compose up` (exited containers are started again); install is idempotent.
  wordpress-bootstrap:
    image: wordpress:cli
    depends_on:
      - wordpress
      - db
    restart: "no"
    volumes_from:
      - wordpress
    links:
      - db:mysql
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - type: bind
        source: "./bin/wpcli-entrypoint.sh"
        target: "/bin/wpcli-entrypoint.sh"
        read_only: true
      - type: bind
        source: "./bin/wp-plugins.txt"
        target: "/bin/wp-plugins.txt"
        read_only: true
    entrypoint: ["/bin/sh", "/bin/wpcli-entrypoint.sh"]
    command: ["wp", "plugin", "list", "--status=active"]

  my-wpcli:
    image: wordpress:cli
    # Not part of default `docker compose up` — avoids a second always-on CLI beside `compose run` one-offs.
    # Use: `docker compose run --rm my-wpcli wp …` (Compose v2 activates this profile for explicit `run`).
    # To attach an idle shell with the stack: `docker compose --profile wpcli up -d my-wpcli`.
    profiles:
      - wpcli
    # Match wordpress:cli defaults so wp can read core + write plugins (uid 1000 often breaks wp core is-installed / installs on bind-mounted wp-content).
    depends_on:
      - wordpress
      - db
    volumes_from:
      - wordpress
    links:
      - db:mysql
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - type: bind
        source: "./bin/wpcli-entrypoint.sh"
        target: "/bin/wpcli-entrypoint.sh"
        read_only: true
      - type: bind
        source: "./bin/wp-plugins.txt"
        target: "/bin/wp-plugins.txt"
        read_only: true
    entrypoint: ["/bin/sh", "/bin/wpcli-entrypoint.sh"]
    tty: true

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "${PHP_MYADMIN_PORT}:80"  # You can change the first number (8080) to any port you prefer for accessing phpMyAdmin
    environment:
      PMA_HOST: db
      PMA_USER: ${DB_USER}
      PMA_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - db

volumes:
  db_data: {}
  tailscale_state: {}
